<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanchonete Lavinea | Cardápio Digital & Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --primary-light: #fff1f2;
      --accent: #f77f00;
      --dark: #0f172a;
      --gray-900: #111827;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;
      --white: #ffffff;
      --success: #10b981;
      --radius: 18px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.07), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #f8fafc;
      color: var(--gray-900);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      padding: 28px 20px 44px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .brand-info h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-info p {
      color: #cbd5e1;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .status-badge {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      animation: pulseStatus 1.8s infinite;
    }

    .status-badge.closed {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    @keyframes pulseStatus {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }

    .cart-btn-top {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      transition: var(--transition);
    }

    .cart-btn-top:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .cart-btn-top.bump, .mobile-cart-bar.bump {
      transform: scale(1.06);
    }

    .badge-count {
      background: var(--primary);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 12px;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: -26px auto 0;
      padding: 0 20px;
      position: relative;
    }

    /* Search & Filter */
    .search-box {
      background: white;
      padding: 10px 18px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-200);
      margin-bottom: 22px;
      transition: var(--transition);
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.12);
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      padding: 8px 10px;
      color: var(--gray-700);
    }

    .clear-search {
      background: var(--gray-100);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--gray-500);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
      margin-bottom: 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(248, 250, 252, 0.92);
      backdrop-filter: blur(8px);
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: white;
      border: 1px solid var(--gray-200);
      color: var(--gray-700);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: var(--transition);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(230, 57, 70, 0.28);
    }

    /* Menu Sections */
    .category-section {
      margin-bottom: 38px;
      animation: fadeInUp 0.35s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gray-200);
    }

    .section-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-500);
      background: var(--gray-200);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .menu-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 32px -8px rgba(0,0,0,0.12);
      border-color: rgba(230, 57, 70, 0.2);
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
    }

    .card-icon {
      font-size: 38px;
      background: var(--gray-100);
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gray-900);
      line-height: 1.3;
      padding-right: 65px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--gray-500);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    /* Interactive Size Pills on Card (for Refri/Suco) */
    .card-variants {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .variant-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--gray-200);
      background: var(--gray-100);
      color: var(--gray-700);
      cursor: pointer;
      transition: var(--transition);
    }

    .variant-pill.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--gray-100);
    }

    .card-price-box {
      display: flex;
      flex-direction: column;
    }

    .card-price-label {
      font-size: 11px;
      color: var(--gray-500);
      font-weight: 600;
    }

    .card-price {
      font-size: 19px;
      font-weight: 800;
      color: var(--gray-900);
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn-add:hover {
      background: var(--primary-dark);
      transform: scale(1.03);
    }

    .btn-add.added {
      background: var(--success);
    }

    /* Item Customization Modal */
    .custom-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .custom-modal-overlay.open {
      display: flex;
    }

    .custom-modal {
      background: white;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      border-radius: 22px;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: zoomIn 0.22s ease;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .option-group {
      margin: 16px 0;
      padding-top: 14px;
      border-top: 1px solid var(--gray-100);
    }

    .option-group-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--gray-700);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .option-item:hover {
      border-color: var(--primary);
    }

    .option-item.selected {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .option-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .option-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Cart Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -460px;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: white;
      z-index: 1001;
      box-shadow: -10px 0 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-header h2 {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      background: var(--gray-100);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .close-btn:hover {
      background: var(--gray-200);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-500);
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-100);
      gap: 10px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--gray-900);
    }

    .cart-item-details {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 3px;
      line-height: 1.4;
    }

    .cart-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gray-100);
      padding: 5px 8px;
      border-radius: 10px;
    }

    .qty-btn {
      background: white;
      border: 1px solid var(--gray-200);
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }

    .qty-count {
      font-size: 13px;
      font-weight: 800;
      min-width: 18px;
      text-align: center;
    }

    .drawer-footer {
      padding: 20px;
      background: #fafafa;
      border-top: 1px solid var(--gray-200);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 8px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      color: var(--gray-900);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--gray-200);
    }

    .btn-checkout {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      box-shadow: 0 8px 18px rgba(16, 185, 129, 0.25);
    }

    .btn-checkout:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* Checkout Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      border-radius: 22px;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .modal-card h3 {
      font-size: 20px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);
    }

    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .radio-label {
      border: 1px solid var(--gray-200);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      transition: var(--transition);
    }

    .radio-label.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .troco-preview {
      font-size: 12px;
      font-weight: 700;
      color: var(--success);
      margin-top: 6px;
    }

    .btn-send-whatsapp {
      width: 100%;
      background: #25d366;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3);
      transition: var(--transition);
    }

    .btn-send-whatsapp:hover {
      background: #1eb857;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gray-900);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Mobile Floating Bar */
    .mobile-cart-bar {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      background: var(--dark);
      color: white;
      padding: 14px 22px;
      border-radius: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 900;
      cursor: pointer;
      transition: var(--transition);
    }

    @media (max-width: 768px) {
      .cart-btn-top {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">🍔</div>
        <div class="brand-info">
          <h1>Lanchonete Lavinea</h1>
          <p id="storeStatusText"><span class="status-badge"></span> Aberto agora • Entrega média: 30-45 min</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="cart-btn-top" id="topCartBtn" onclick="toggleCart()">
          🛒 Meu Pedido
          <span class="badge-count" id="cartCountTop">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Search Bar -->
    <div class="search-box">
      <span style="font-size: 18px; margin-right: 6px;">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar pastel, coxinha, hambúrguer, cuscuz, refri ou suco..." oninput="handleSearch()">
      <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()">✕</button>
    </div>

    <!-- Category Buttons -->
    <div class="categories-bar">
      <button class="cat-btn active" onclick="filterCategory('todos', this)">🔥 Todos</button>
      <button class="cat-btn" onclick="filterCategory('pasteis', this)">🥟 Pastéis</button>
      <button class="cat-btn" onclick="filterCategory('coxinhas', this)">🍗 Coxinhas</button>
      <button class="cat-btn" onclick="filterCategory('hamburgueres', this)">🍔 Hambúrgueres</button>
      <button class="cat-btn" onclick="filterCategory('cuscuz', this)">🌽 Cuscuz</button>
      <button class="cat-btn" onclick="filterCategory('refri', this)">🥤 Refrigerantes</button>
      <button class="cat-btn" onclick="filterCategory('sucos', this)">🧃 Sucos</button>
    </div>

    <!-- Menu Sections Container -->
    <div id="menuSectionsContainer"></div>
  </div>

  <!-- Item Customization Modal -->
  <div class="custom-modal-overlay" id="customModalOverlay" onclick="closeCustomModalOnBg(event)">
    <div class="custom-modal" id="customModalContent"></div>
  </div>

    // Verificar horário de funcionamento (ex: 17:00 às 23:30)
    function checkStoreStatus() {
      const now = new Date();
      const hour = now.getHours();
      const minutes = now.getMinutes();
      const timeInMinutes = hour * 60 + minutes;

      const openTime = 17 * 60; // 17:00
      const closeTime = 23 * 60 + 30; // 23:30
      const statusEl = document.getElementById("storeStatusText");

      if (timeInMinutes >= openTime && timeInMinutes <= closeTime) {
        statusEl.innerHTML = `<span class="status-badge"></span> Aberto agora • Entrega média: 30-45 min`;
      } else {
        statusEl.innerHTML = `<span class="status-badge closed"></span> Fechado agora (Abrimos às 17h) • Agende seu pedido`;
      }
    }

    // Selecionar variante (250ml, Lata, 1L, 2L) direto no card
    function selectCardVariant(productId, variantIndex, event) {
      event.stopPropagation();
      selectedVariants[productId] = variantIndex;
      renderSections();
    }

    // Renderizar seções e cards do cardápio
    function renderSections() {
      const container = document.getElementById("menuSectionsContainer");
      const searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
      container.innerHTML = "";

      const categoriesToRender = currentCategory === "todos"
        ? categoriesInfo
        : categoriesInfo.filter(c => c.id === currentCategory);

      let totalRenderedItems = 0;

      categoriesToRender.forEach(cat => {
        const items = menuData.filter(item => {
          const matchesCat = item.category === cat.id;
          const matchesSearch = !searchQuery ||
            item.title.toLowerCase().includes(searchQuery) ||
            item.desc.toLowerCase().includes(searchQuery);
          return matchesCat && matchesSearch;
        });

        if (items.length === 0) return;
        totalRenderedItems += items.length;

        const section = document.createElement("section");
        section.className = "category-section";
        section.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">${cat.title}</h2>
            <span class="section-count">${items.length} ${items.length === 1 ? 'opção' : 'opções'}</span>
          </div>
          <div class="menu-grid" id="grid-${cat.id}"></div>
        `;
        container.appendChild(section);

        const grid = section.querySelector(`#grid-${cat.id}`);

        items.forEach(item => {
          const activeVarIdx = selectedVariants[item.id] || 0;
          const currentPrice = item.variants ? item.variants[activeVarIdx].price : item.price;

          let variantsHtml = "";
          if (item.variants) {
            variantsHtml = `<div class="card-variants">` +
              item.variants.map((v, idx) => `
                <button class="variant-pill ${idx === activeVarIdx ? 'active' : ''}"
                        onclick="selectCardVariant(${item.id}, ${idx}, event)">
                  ${v.label}
                </button>
              `).join("") +
            `</div>`;
          }

          const hasCustomization = (item.addons && item.addons.length > 0) || (item.sugarOptions && item.sugarOptions.length > 0);
          const btnText = hasCustomization ? "Montar / Pedir" : "+ Adicionar";

          const card = document.createElement("div");
          card.className = "menu-card";
          card.innerHTML = `
            ${item.badge ? `<span class="card-badge">${item.badge}</span>` : ""}
            <div class="card-top">
              <div class="card-icon">${item.icon}</div>
              <h3 class="card-title">${item.title}</h3>
            </div>
            <p class="card-desc">${item.desc}</p>
            ${variantsHtml}
            <div class="card-footer">
              <div class="card-price-box">
                <span class="card-price-label">${item.variants ? item.variants[activeVarIdx].label : 'Valor'}</span>
                <span class="card-price">R$ ${currentPrice.toFixed(2).replace(".", ",")}</span>
              </div>
              <button class="btn-add" id="btn-add-${item.id}" onclick="handleItemAction(${item.id})">
                ${btnText}
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      });

      if (totalRenderedItems === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; color: var(--gray-500);">
            <p style="font-size: 42px; margin-bottom: 10px;">🔎</p>
            <p style="font-weight: 700; font-size: 16px;">Nenhum item encontrado para "${searchQuery}"</p>
            <p style="font-size: 13px; margin-top: 4px;">Tente buscar por pastel, coxinha, hambúrguer, cuscuz, refri ou suco.</p>
          </div>
        `;
      }
    }

    // Filtro por categoria
    function filterCategory(category, buttonEl) {
      currentCategory = category;
      document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
      if (buttonEl) buttonEl.classList.add("active");
      renderSections();
    }

    // Busca em tempo real
    function handleSearch() {
      const val = document.getElementById("searchInput").value;
      document.getElementById("clearSearchBtn").style.display = val ? "flex" : "none";
      renderSections();
    }

      document.getElementById("searchInput").value = "";
      document.getElementById("clearSearchBtn").style.display = "none";
      renderSections();
    }

    // Decidir entre adicionar direto ou abrir modal de personalização
    function handleItemAction(productId) {
      const product = menuData.find(p => p.id === productId);
      if (!product) return;

      const hasCustomization = (product.addons && product.addons.length > 0) || (product.sugarOptions && product.sugarOptions.length > 0);

      if (hasCustomization) {
        openCustomModal(product);
      } else {
        const varIdx = selectedVariants[product.id] || 0;
        const variant = product.variants ? product.variants[varIdx] : null;
        const finalTitle = variant ? `${product.title} (${variant.label})` : product.title;
        const finalPrice = variant ? variant.price : product.price;

        addItemToCart({
          key: `${product.id}-${varIdx}`,
          id: product.id,
          title: finalTitle,
          price: finalPrice,
          details: ""
        });

        // Feedback visual no botão
        const btn = document.getElementById(`btn-add-${product.id}`);
        if (btn) {
          const original = btn.innerHTML;
          btn.classList.add("added");
          btn.innerHTML = "✓ Adicionado";
          setTimeout(() => {
            btn.classList.remove("added");
            btn.innerHTML = original;
          }, 900);
        }
      }
    }

    let modalState = {
      product: null,
      variantIdx: 0,
      selectedAddons: [],
      sugar: "Com Açúcar",
      note: ""

        note: ""

      document.getElementById("customModalOverlay").classList.add("open");

    function closeCustomModal() {

    function closeCustomModalOnBg(e) {

    function toggleModalAddon(addonIdx) {
      const exists = modalState.selectedAddons.includes(addonIdx);
      if (exists) {
        modalState.selectedAddons = modalState.selectedAddons.filter(i => i !== addonIdx);

        modalState.selectedAddons.push(addonIdx);

      modalState.variantIdx = idx;
      renderCustomModal();
    }

      modalState.sugar = opt;

    }

    function renderCustomModal() {
      const p = modalState.product;
      const basePrice = p.variants ? p.variants[modalState.variantIdx].price : p.price;
      const addonsTotal = modalState.selectedAddons.reduce((sum, idx) => sum + p.addons[idx].price, 0);
      const total = basePrice + addonsTotal;

      let variantsSection = "";
      if (p.variants) {
        variantsSection = `

          </div>
        `;
      }

      let sugarSection = "";
      if (p.sugarOptions) {
        sugarSection = `
          <div class="option-group">
            <div class="option-group-title"><span>Como prefere o suco?</span><span>Obrigatório</span></div>
            ${p.sugarOptions.map(opt => `
              <div class="option-item ${modalState.sugar === opt ? 'selected' : ''}" onclick="selectModalSugar('${opt}')">
                <div class="option-item-left">
                  <span>${modalState.sugar === opt ? '🔘' : '⚪'}</span>
                  <span>${opt}</span>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      let addonsSection = "";
      if (p.addons) {
        addonsSection = `
          <div class="option-group">
            <div class="option-group-title"><span>Turbine seu lanche (Opcional)</span><span>Adicionais</span></div>
            ${p.addons.map((ad, idx) => {
              const checked = modalState.selectedAddons.includes(idx);
              return `
                <div class="option-item ${checked ? 'selected' : ''}" onclick="toggleModalAddon(${idx})">
                  <div class="option-item-left">
                    <span>${checked ? '✅' : '⬜'}</span>
                    <span>${ad.name}</span>
                  </div>
                  <span class="option-item-price">+ R$ ${ad.price.toFixed(2).replace('.', ',')}</span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      document.getElementById("customModalContent").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:36px;">${p.icon}</span>
            <div>
              <h3 style="font-size:18px; font-weight:800;">${p.title}</h3>
              <p style="font-size:12.5px; color:var(--gray-500); margin-top:2px;">${p.desc}</p>
            </div>
          </div>
          <button class="close-btn" onclick="closeCustomModal()">✕</button>
        </div>

        ${variantsSection}
        ${sugarSection}
        ${addonsSection}

        <div class="option-group">
          <div class="option-group-title"><span>Observação neste item</span><span>Opcional</span></div>
          <input type="text" id="itemCustomNote" value="${modalState.note}" oninput="modalState.note = this.value"
                 placeholder="Ex: Sem cebola, sem gelo, bem passado..."
                 style="width:100%; padding:11px 13px; border:1px solid var(--gray-200); border-radius:10px; font-size:13.5px; outline:none;">
        </div>

        <button class="btn-checkout" style="background: var(--primary); box-shadow: 0 8px 18px rgba(230,57,70,0.25);" onclick="confirmCustomItem()">
          Adicionar ao Pedido • R$ ${total.toFixed(2).replace('.', ',')}
        </button>
      `;
    }

    function confirmCustomItem() {
      const p = modalState.product;
      const variant = p.variants ? p.variants[modalState.variantIdx] : null;
      const basePrice = variant ? variant.price : p.price;
      const chosenAddons = modalState.selectedAddons.map(idx => p.addons[idx]);
      const addonsTotal = chosenAddons.reduce((sum, a) => sum + a.price, 0);
      const finalPrice = basePrice + addonsTotal;

      const title = variant ? `${p.title} (${variant.label})` : p.title;
      let detailsParts = [];
      if (modalState.sugar) detailsParts.push(modalState.sugar);
      if (chosenAddons.length > 0) detailsParts.push("Adicionais: " + chosenAddons.map(a => a.name).join(", "));
      if (modalState.note.trim()) detailsParts.push("Obs: " + modalState.note.trim());

      const details = detailsParts.join(" | ");
      const uniqueKey = `${p.id}-${modalState.variantIdx}-${details}`;

      addItemToCart({
        key: uniqueKey,
        id: p.id,
        title,
        price: finalPrice,
        details
      });

      closeCustomModal();
    }

    // Adicionar item ao carrinho
    function addItemToCart(newItem) {
      const existing = cart.find(item => item.key === newItem.key);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...newItem, qty: 1 });
      }

      updateCart();
      showToast(`${newItem.title} adicionado!`);

      // Efeito visual no botão do carrinho
      const topBtn = document.getElementById("topCartBtn");
      const mobBar = document.getElementById("mobileCartBar");
      topBtn.classList.add("bump");
      mobBar.classList.add("bump");
      setTimeout(() => {
        topBtn.classList.remove("bump");
        mobBar.classList.remove("bump");
      }, 250);
    }

    function changeQty(key, delta) {
      const item = cart.find(i => i.key === key);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.key !== key);
      }
      updateCart();
    }

    function clearCart() {
      if (confirm("Deseja esvaziar seu carrinho?")) {
        cart = [];
        updateCart();
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toastMsg");
      toast.innerText = `✅ ${message}`;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    // Atualizar Carrinho
    function updateCart() {
      localStorage.setItem("lavinea_cart_v2", JSON.stringify(cart));

      const cartList = document.getElementById("cartList");
      const cartFooter = document.getElementById("cartFooter");
      const cartCountTop = document.getElementById("cartCountTop");
      const mobileBar = document.getElementById("mobileCartBar");
      const mobileItemCount = document.getElementById("mobileItemCount");
      const mobileTotal = document.getElementById("mobileTotal");
      const btnClearCart = document.getElementById("btnClearCart");

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      cartCountTop.innerText = totalItems;

      if (cart.length === 0) {
        cartList.innerHTML = `
          <div class="empty-cart-msg">
            <p style="font-size: 44px;">🛒</p>
            <p style="margin-top: 12px; font-weight: 700; color: var(--gray-700);">Seu carrinho está vazio</p>
            <p style="font-size: 13px; margin-top: 4px;">Escolha seus pastéis, coxinhas, hambúrgueres ou cuscuz!</p>
          </div>
        `;
        cartFooter.style.display = "none";
        mobileBar.style.display = "none";
        btnClearCart.style.display = "none";
        return;
      }

      cartFooter.style.display = "block";
      btnClearCart.style.display = "inline-block";
      if (window.innerWidth <= 768) {
        mobileBar.style.display = "flex";
      } else {
        mobileBar.style.display = "none";
      }

      let subtotal = 0;
      cartList.innerHTML = "";

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;

        const row = document.createElement("div");
        row.className = "cart-item";
        row.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-title">${item.title}</div>
            ${item.details ? `<div class="cart-item-details">${item.details}</div>` : ""}
            <div class="cart-item-price">R$ ${itemTotal.toFixed(2).replace(".", ",")}</div>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn" onclick="changeQty('${item.key.replace(/'/g, "\\'")}', -1)">−</button>
            <span class="qty-count">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${item.key.replace(/'/g, "\\'")}', 1)">+</button>
          </div>
        `;
        cartList.appendChild(row);
      });

      const currentTaxa = (orderType === "delivery") ? deliveryFee : 0;
      const total = subtotal + currentTaxa;

      document.getElementById("subtotalVal").innerText = `R$ ${subtotal.toFixed(2).replace(".", ",")}`;
      document.getElementById("taxaVal").innerText = currentTaxa === 0 ? "Grátis (Balcão)" : `R$ ${currentTaxa.toFixed(2).replace(".", ",")}`;
      document.getElementById("totalVal").innerText = `R$ ${total.toFixed(2).replace(".", ",")}`;

      mobileItemCount.innerText = `${totalItems} ${totalItems === 1 ? 'item' : 'itens'}`;
      mobileTotal.innerText = `R$ ${total.toFixed(2).replace(".", ",")}`;
    }

    function toggleCart() {
      document.getElementById("cartDrawer").classList.toggle("open");
      document.getElementById("drawerOverlay").classList.toggle("open");
    }

    function selectOrderType(type) {
      orderType = type;
      const optDel = document.getElementById("optDelivery");
      const optBal = document.getElementById("optBalcao");
      const addrFields = document.getElementById("addressFields");

      if (type === "delivery") {
        optDel.classList.add("selected");
        optBal.classList.remove("selected");
        addrFields.style.display = "block";
      } else {
        optBal.classList.add("selected");
        optDel.classList.remove("selected");
        addrFields.style.display = "none";
      }
      updateCart();
      calculateTroco();
    }

    function toggleTrocoField() {
      const payMethod = document.getElementById("custPayMethod").value;
      const trocoGroup = document.getElementById("trocoGroup");
      trocoGroup.style.display = (payMethod === "Dinheiro") ? "block" : "none";
    }

    function calculateTroco() {
      const trocoVal = parseFloat(document.getElementById("custTroco").value);
      const preview = document.getElementById("trocoPreview");
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const taxa = orderType === "delivery" ? deliveryFee : 0;
      const total = subtotal + taxa;

      if (!isNaN(trocoVal) && trocoVal > total) {
        const diff = trocoVal - total;
        preview.innerText = `Troco a receber: R$ ${diff.toFixed(2).replace(".", ",")}`;
      } else if (!isNaN(trocoVal) && trocoVal <= total && trocoVal > 0) {
        preview.innerText = `Valor menor ou igual ao total do pedido.`;
      } else {
        preview.innerText = "";
      }
    }

    function openCheckoutModal() {
      if (cart.length === 0) return;
      toggleCart();
      document.getElementById("checkoutModal").classList.add("open");
    }

    function closeCheckoutModal() {
      document.getElementById("checkoutModal").classList.remove("open");
    }

    function sendOrderViaWhatsApp() {
      if (cart.length === 0) return;

      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const payMethod = document.getElementById("custPayMethod").value;
      const obs = document.getElementById("custObs").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const ref = document.getElementById("custRef").value.trim();
      const trocoInput = parseFloat(document.getElementById("custTroco").value);

      if (!name) {
        alert("Por favor, preencha seu nome!");
        return;
      }
      if (!phone) {
        alert("Por favor, preencha seu WhatsApp!");
        return;
      }
      if (orderType === "delivery" && !address) {
        alert("Por favor, informe seu endereço de entrega!");
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const taxa = orderType === "delivery" ? deliveryFee : 0;
      const total = subtotal + taxa;
      const orderNum = Math.floor(1000 + Math.random() * 9000);

      let msg = `*NOVO PEDIDO #${orderNum} - LANCHONETE LAVINEA*\n`;
      msg += `--------------------------------\n`;
      msg += `👤 *Cliente:* ${name}\n`;
      msg += `📞 *WhatsApp:* ${phone}\n`;
      msg += `🛵 *Tipo:* ${orderType === 'delivery' ? 'Entrega em Domicílio' : 'Retirada no Balcão'}\n`;

      if (orderType === 'delivery') {
        msg += `📍 *Endereço:* ${address}\n`;
        if (ref) msg += `📌 *Ref:* ${ref}\n`;
      }

      msg += `--------------------------------\n`;
      msg += `*ITENS DO PEDIDO:*\n`;
      cart.forEach(item => {
        msg += `▪ *${item.qty}x ${item.title}* - R$ ${(item.price * item.qty).toFixed(2).replace('.', ',')}\n`;
        if (item.details) {
          msg += `   _${item.details}_\n`;
        }
      });

      msg += `--------------------------------\n`;
      msg += `💵 *Subtotal:* R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
      msg += `🛵 *Taxa Entrega:* ${taxa === 0 ? 'Grátis' : 'R$ ' + taxa.toFixed(2).replace('.', ',')}\n`;
      msg += `💰 *TOTAL A PAGAR:* R$ ${total.toFixed(2).replace('.', ',')}\n`;
      msg += `💳 *Pagamento:* ${payMethod}\n`;

      if (payMethod === 'Dinheiro') {
        if (!isNaN(trocoInput) && trocoInput > total) {
          const trocoDev = trocoInput - total;
          msg += `🪙 *Troco para:* R$ ${trocoInput.toFixed(2).replace('.', ',')} (Levar R$ ${trocoDev.toFixed(2).replace('.', ',')} de troco)\n`;
        } else {
          msg += `🪙 *Troco:* Não precisa\n`;
        }
      }

      if (obs) {
        msg += `📝 *Observações:* ${obs}\n`;
      }
      msg += `--------------------------------\n`;
      msg += `Aguardando confirmação do pedido!`;

      // Altere para o número real da lanchonete (55 + DDD + Número)
      const zapNumber = "5584999999999";
      const whatsappUrl = `https://wa.me/${zapNumber}?text=${encodeURIComponent(msg)}`;

      window.open(whatsappUrl, "_blank", "noopener,noreferrer");

      cart = [];
      updateCart();
      closeCheckoutModal();
    }

    window.addEventListener("resize", updateCart);

    // Inicializar
    checkStoreStatus();
    renderSections();
    updateCart();
  </script>
</body>
</html>
